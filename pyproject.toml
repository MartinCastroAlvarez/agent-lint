[tool.poetry]
name = "agent-lint"
version = "0.1.0"
description = "Ratcheting lint gate for code written by AI coding agents: new findings fail, the baseline only tightens, and suppressions, skipped tests and weakened configs are caught."
authors = ["Martín Castro Álvarez <martincastro.10.5@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/MartinCastroAlvarez/agent-lint"
repository = "https://github.com/MartinCastroAlvarez/agent-lint"
documentation = "https://github.com/MartinCastroAlvarez/agent-lint#readme"
keywords = [
    "lint",
    "ratchet",
    "baseline",
    "ai-agents",
    "claude-code",
    "code-quality",
    "ruff",
    "mypy",
    "eslint",
    "sarif",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
packages = [{ include = "agent_lint" }]
include = [
    { path = "LICENSE", format = ["sdist", "wheel"] },
]

[tool.poetry.scripts]
agent-lint = "agent_lint.cli:main"

[tool.poetry.dependencies]
# No runtime dependencies: the linters are whatever the project already uses.
python = "^3.11"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-cov = ">=5,<8"
ruff = ">=0.6"
mypy = "^1.11 || ^2.0"
bandit = "^1.7"
pip-audit = "^2.7"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"

# --------------------------------------------------------------------------- #
# agent-lint on itself
# --------------------------------------------------------------------------- #
[tool.agent-lint]
tools = ["ruff", "mypy", "bandit"]
# Test fixtures deliberately contain suppressions, skips and weak configs.
exclude = ["tests/fixtures/**"]

[tool.agent-lint.mypy]
args = ["agent_lint"]

[tool.agent-lint.bandit]
args = ["-r", "agent_lint"]

# --------------------------------------------------------------------------- #
# Ruff — lint + format
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # bugbear
    "S",            # bandit-style security
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RET",          # returns
    "PIE",          # misc
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S603", "S607", "E501"]
# The single place that starts processes (argv lists, shell=False).
"agent_lint/proc.py" = ["S603"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["agent_lint", "tests"]

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=agent_lint",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
filterwarnings = ["error"]

# --------------------------------------------------------------------------- #
# MyPy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

# --------------------------------------------------------------------------- #
# Coverage
# --------------------------------------------------------------------------- #
[tool.coverage.run]
branch = true
source = ["agent_lint"]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# --------------------------------------------------------------------------- #
# Bandit
# --------------------------------------------------------------------------- #
[tool.bandit]
exclude_dirs = ["tests", "examples", ".venv", "build", "dist"]
